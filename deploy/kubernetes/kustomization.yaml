# Kustomization file for go-tor Kubernetes deployment
# Use with: kubectl apply -k deploy/kubernetes/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-tor

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/name: go-tor
  app.kubernetes.io/version: "0.1.0"
  app.kubernetes.io/managed-by: kustomize
