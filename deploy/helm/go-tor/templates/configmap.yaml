apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "go-tor.fullname" . }}-config
  labels:
    {{- include "go-tor.labels" . | nindent 4 }}
data:
  torrc: |
    # Production Tor Configuration for Kubernetes
    # Generated by Helm chart

    # Network Settings
    SocksPort {{ .Values.service.socksPort }}
    ControlPort {{ .Values.service.controlPort }}
    
    # Logging
    LogLevel {{ .Values.config.logLevel }}

    # Circuit Configuration
    NumEntryGuards {{ .Values.config.numEntryGuards }}
    UseEntryGuards {{ .Values.config.useEntryGuards }}
    CircuitBuildTimeout {{ .Values.config.circuitBuildTimeout }}
    MaxCircuitDirtiness {{ .Values.config.maxCircuitDirtiness }}
    NewCircuitPeriod {{ .Values.config.newCircuitPeriod }}

    # Connection Settings
    ConnLimit {{ .Values.config.connLimit }}
    DormantTimeout {{ .Values.config.dormantTimeout }}

    # Performance Tuning
    EnableConnectionPooling {{ .Values.config.enableConnectionPooling }}
    ConnectionPoolMaxIdle {{ .Values.config.connectionPoolMaxIdle }}
    ConnectionPoolMaxLife {{ .Values.config.connectionPoolMaxLife }}
    EnableCircuitPrebuilding {{ .Values.config.enableCircuitPrebuilding }}
    CircuitPoolMinSize {{ .Values.config.circuitPoolMinSize }}
    CircuitPoolMaxSize {{ .Values.config.circuitPoolMaxSize }}
    EnableBufferPooling {{ .Values.config.enableBufferPooling }}

    # Isolation
    IsolationLevel {{ .Values.config.isolationLevel }}
